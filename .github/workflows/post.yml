name: post
on:
  schedule:
    - cron: "*/15 * * * *"
    # Exact post slots (UTC = Accra time), with retries a few minutes later in case a run is dropped.
    - cron: "31,36,45 12 * * *"
    - cron: "1,6,15 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Publish anything due
        env:
          IG_CLOUD: "1"
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_MEDIA_REPO: ${{ github.repository }}
        run: python ig.py queue-run
      - name: Record status
        if: always()
        run: |
          git config user.name "ig-runner"
          git config user.email "ig-runner@users.noreply.github.com"
          git add queue.json posted.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "runner: status update"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
